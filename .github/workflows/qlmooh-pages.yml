name: Deploy QLMooh Preview

on:
  push:
    branches:
      - qlmooh-preview-host
    paths:
      - 'qlmooh-preview/**'
      - '.github/workflows/qlmooh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qlmooh-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./qlmooh-preview
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
