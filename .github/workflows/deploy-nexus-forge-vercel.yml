name: Deploy NEXUS FORGE OS to Vercel

on:
  push:
    branches:
      - nexus-forge-os
    paths-ignore:
      - '.github/workflows/snapshot-nexus-forge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: nexus-forge-os

      - name: Check Vercel credential
        id: auth
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_TOKEN is not configured; source is versioned but automatic deployment is skipped.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to existing Vercel production project
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
