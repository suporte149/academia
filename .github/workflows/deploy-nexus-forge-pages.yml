name: Deploy NEXUS FORGE OS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-nexus-forge-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEXUS FORGE source branch
        uses: actions/checkout@v4
        with:
          ref: nexus-forge-os
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp index.html _site/404.html
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
